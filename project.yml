name: Fathom
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  IDKit:
    url: https://github.com/worldcoin/idkit-swift.git
    from: 4.2.0
targets:
  Fathom:
    type: application
    platform: iOS
    dependencies:
      - package: IDKit
    sources:
      - path: Fathom
    entitlements:
      path: Fathom/Fathom.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - TAG
          - NDEF
    info:
      path: Fathom/Info.plist
      properties:
        CFBundleDisplayName: Fathom
        CFBundleName: Fathom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NFCReaderUsageDescription: Fathom reads the NFC chip you present to prove possession of your enrolled mark.
        FATHOM_GATE_TOKEN: $(FATHOM_GATE_TOKEN)
        FATHOM_GATE_BASE_URL: $(FATHOM_GATE_BASE_URL)
        FATHOM_WORLD_APP_ID: $(FATHOM_WORLD_APP_ID)
        CFBundleURLTypes:
          - CFBundleURLName: com.example.fathom.worldid
            CFBundleURLSchemes: [fathom]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fathom
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
